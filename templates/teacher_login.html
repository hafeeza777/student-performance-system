<!DOCTYPE html>
<html>
<head>
<title>Teacher Login</title>

<style>

body{
    margin:0;
    font-family:Segoe UI,Tahoma,sans-serif;
    background:#eef1f5;
}

.navbar{
    background:#1e3a8a;
    color:white;
    padding:16px 50px;
}

.navbar h2{
    margin:0;
}

.container{

    width:420px;
    margin:70px auto;
    background:white;
    padding:35px;
    border-radius:10px;
    box-shadow:0 4px 12px rgba(0,0,0,.15);

}

h2{

    text-align:center;
    color:#1e3a8a;
    margin-bottom:30px;

}

input{

    width:100%;
    padding:12px;
    margin-bottom:18px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;

}

button{

    width:100%;
    padding:12px;
    background:#1e3a8a;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;

}

button:hover{

    background:#163172;

}

.error{

    color:red;
    text-align:center;
    margin-bottom:15px;

}

</style>

</head>

<body>

<div class="navbar">

<h2>Teacher Portal</h2>

</div>

<div class="container">

<h2>Teacher Login</h2>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="POST">

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">

Login

</button>

</form>

</div>

</body>

</html>
